<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercise 3 | Designing a Card</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <h1>Exercise 3 | Designing a Card</h1>
    <main>
        <div>
            <h2>Card Image</h2>
            <img src="card.png" alt="Card Image">
        </div>

        <div class="hr"></div>

        <div>
            <h2>My HTML Card</h2>
            <div class="card">
                <img src="images.png" alt="Card Image">

                <p class="tags">Nature</p>
                <p class="tags">Lake</p>

                <h3 class="title">Laga di Braies</h3>

                <p class="para">Lorem ipsum dolor sit, amet consectetur adipisicing elit. Consectetur sodales morbi
                    dignissim sed diam pharetra vitae ipsum odio.</p>

                <p class="button">Read more</p>
            </div>
        </div>
    </main>
</body>

</html>
