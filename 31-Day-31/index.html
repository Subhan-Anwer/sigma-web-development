<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Media Queries</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1>CSS Media Queries</h1>
    <p>The body will turn green if screen is 800 pixels or less</p>

    <div class="container">
        <div class="box1">This is Box 1</div>
        <div class="box2">This is Box 2</div>
        <div class="box3">This is Box 3</div>
    </div>
    <p>Boxes will turn from Red, Green, Blue to Pink, Orange, Purple if screen is 1000 pixels or less</p>
</body>
</html>
